<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradientes de poder nigromántico y escarcha rúnica -->
    <radialGradient id="purpleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#6b21a8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#4c1d95" stop-opacity="0"/>
    </radialGradient>
    
    <radialGradient id="frostGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="30%" stop-color="#7dd3fc"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <linearGradient id="helmSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="35%" stop-color="#1e1b4b"/>
      <stop offset="70%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#0f0926"/>
    </linearGradient>

    <linearGradient id="purpleSteel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#581c87"/>
      <stop offset="100%" stop-color="#1e1035"/>
    </linearGradient>

    <filter id="neonFrost" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="purpleAura" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Aura mística de fondo (Necrotic Purple & Frozen Cyan) -->
  <circle cx="60" cy="62" r="54" fill="url(#purpleGlow)"/>
  <circle cx="60" cy="48" r="28" fill="url(#frostGlow)"/>

  <!-- ========================================================
       YELMO / CORONA DEL REY EXÁNIME (HELM OF DOMINATION)
       ======================================================== -->
  <g id="helm-base">
    <!-- Puntas y crestas traseras de la corona -->
    <path d="M60 22 L45 8 L49 32 L30 18 L38 42 L18 34 L32 55 L24 75 L38 68 Z" fill="#1e1035" stroke="#7c3aed" stroke-width="0.8"/>
    <path d="M60 22 L75 8 L71 32 L90 18 L82 42 L102 34 L88 55 L96 75 L82 68 Z" fill="#1e1035" stroke="#7c3aed" stroke-width="0.8"/>

    <!-- Cuernos laterales curvados y afilados -->
    <path d="M22 62 C10 48 8 28 14 18 C17 28 26 38 32 46 Z" fill="url(#helmSteel)" stroke="#a855f7" stroke-width="1.2"/>
    <path d="M98 62 C110 48 112 28 106 18 C103 28 94 38 88 46 Z" fill="url(#helmSteel)" stroke="#a855f7" stroke-width="1.2"/>

    <!-- Púas principales de la corona -->
    <!-- Aguja central izquierda -->
    <path d="M42 45 L36 14 L48 38 L54 20 L58 40 Z" fill="url(#purpleSteel)" stroke="#c084fc" stroke-width="1"/>
    <!-- Aguja central derecha -->
    <path d="M78 45 L84 14 L72 38 L66 20 L62 40 Z" fill="url(#purpleSteel)" stroke="#c084fc" stroke-width="1"/>

    <!-- Máscara / Calavera frontal de la corona -->
    <path d="M34 50 L60 38 L86 50 L84 76 L76 96 L60 106 L44 96 L36 76 Z" fill="url(#helmSteel)" stroke="#7c3aed" stroke-width="1.6"/>
    
    <!-- Relieve de la mandíbula y pómulos esqueléticos -->
    <path d="M38 72 L48 82 L60 88 L72 82 L82 72 L78 92 L60 102 L42 92 Z" fill="#0f0926" stroke="#a855f7" stroke-width="1"/>

    <!-- Ojos espectrales con fulgor de escarcha azul (Frost Eyes) -->
    <polygon points="43,65 52,67 47,72 40,68" fill="#38bdf8" filter="url(#neonFrost)"/>
    <polygon points="77,65 68,67 73,72 80,68" fill="#38bdf8" filter="url(#neonFrost)"/>
    <ellipse cx="46" cy="68" rx="2.5" ry="1.2" fill="#e0f2fe" filter="url(#neonFrost)"/>
    <ellipse cx="74" cy="68" rx="2.5" ry="1.2" fill="#e0f2fe" filter="url(#neonFrost)"/>

    <!-- Gema rúnica frontal de la corona (Rune Gem) -->
    <polygon points="60,42 66,48 60,56 54,48" fill="#38bdf8" stroke="#e0f2fe" stroke-width="1" filter="url(#neonFrost)"/>
    <circle cx="60" cy="49" r="2" fill="#ffffff"/>
  </g>

  <!-- ========================================================
       FROSTMOURNE (ESPADA RÚNICA CLAVADA VERTICALMENTE)
       ======================================================== -->
  <g id="frostmourne-sword">
    <!-- Pomo y Empuñadura superior -->
    <circle cx="60" cy="2" r="2.8" fill="#c084fc" stroke="#e0f2fe" stroke-width="0.8"/>
    <rect x="58.5" y="4" width="3" height="8" fill="#312e81" stroke="#a855f7" stroke-width="0.6"/>

    <!-- Guarda esquelética / Calavera de carnero de la Frostmourne -->
    <!-- Cuernos de la guarda -->
    <path d="M60 12 C52 7 42 10 44 16 C48 15 54 14 58 16 Z" fill="#1e1b4b" stroke="#7dd3fc" stroke-width="0.9"/>
    <path d="M60 12 C68 7 78 10 76 16 C72 15 66 14 62 16 Z" fill="#1e1b4b" stroke="#7dd3fc" stroke-width="0.9"/>
    <!-- Cabeza de la guarda -->
    <polygon points="60,11 65,15 63,19 60,18 57,19 55,15" fill="#0f0926" stroke="#c084fc" stroke-width="1"/>
    <!-- Ojos de la guarda -->
    <circle cx="58" cy="15" r="0.8" fill="#38bdf8"/>
    <circle cx="62" cy="15" r="0.8" fill="#38bdf8"/>

    <!-- Hoja de la espada (Blade) que atraviesa la corona hacia abajo -->
    <!-- Filo exterior izquierdo -->
    <path d="M58 19 L56 34 L54 60 L57 88 L60 114 L60 19 Z" fill="url(#bladeGrad)" stroke="#38bdf8" stroke-width="0.8"/>
    <!-- Filo exterior derecho -->
    <path d="M62 19 L64 34 L66 60 L63 88 L60 114 L60 19 Z" fill="url(#bladeGrad)" stroke="#38bdf8" stroke-width="0.8"/>

    <!-- Canal de runas central con resplandor cian -->
    <line x1="60" y1="20" x2="60" y2="108" stroke="#e0f2fe" stroke-width="1" filter="url(#neonFrost)"/>

    <!-- Inscripciones de Runas Antiguas en la hoja (Glowing Runes) -->
    <!-- Runa 1 -->
    <path d="M59 28 L61 30 M61 28 L59 30 M60 26 L60 32" stroke="#e0f2fe" stroke-width="0.9" filter="url(#neonFrost)"/>
    <!-- Runa 2 -->
    <path d="M59 40 L61 42 M59 42 L61 40 M59 41 L61 41" stroke="#7dd3fc" stroke-width="0.9" filter="url(#neonFrost)"/>
    <!-- Runa 3 -->
    <path d="M59 54 L61 55 L59 56 L61 57" stroke="#e0f2fe" stroke-width="0.9" filter="url(#neonFrost)"/>
    <!-- Runa 4 -->
    <path d="M60 68 L58.5 70 L61.5 70 Z" stroke="#7dd3fc" stroke-width="0.8" fill="#38bdf8" filter="url(#neonFrost)"/>
    <!-- Runa 5 -->
    <path d="M60 82 L59 84 M60 82 L61 84 M60 81 L60 86" stroke="#e0f2fe" stroke-width="0.9" filter="url(#neonFrost)"/>
    <!-- Runa 6 -->
    <path d="M59 96 L61 97 M61 96 L59 97" stroke="#38bdf8" stroke-width="0.9" filter="url(#neonFrost)"/>

    <!-- Impacto / Grieta de escarcha y poder en el punto donde la espada atraviesa la corona -->
    <path d="M52 46 L58 49 L54 53" stroke="#38bdf8" stroke-width="1.2" fill="none" filter="url(#neonFrost)"/>
    <path d="M68 46 L62 49 L66 53" stroke="#38bdf8" stroke-width="1.2" fill="none" filter="url(#neonFrost)"/>
    <path d="M50 78 L56 82 L53 86" stroke="#c084fc" stroke-width="1" fill="none"/>
    <path d="M70 78 L64 82 L67 86" stroke="#c084fc" stroke-width="1" fill="none"/>
  </g>
</svg>
